[package]
name = "entity-rust-cleanroom"
version = "1.0.0"
edition = "2024"
description = "BTG-controlled ENTITY clean-room verifier and conformance baseline for reproducible protocol testing"
license = "Apache-2.0"
repository = "https://github.com/blackmore-technology-group/ENTITY-RUST-CLEANROOM"
homepage = "https://blackmore-technology-group.github.io/ENTITY-DOCS/"
readme = "README.md"
keywords = ["authorization", "provenance", "conformance", "interoperability", "verification"]
categories = ["command-line-utilities", "cryptography", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
aes-gcm = "0.10"
hex = "0.4"
