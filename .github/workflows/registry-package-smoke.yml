name: Registry package smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Build and verify crates.io package
        run: |
          cargo test --locked
          cargo package --allow-dirty
          echo 'crates.io package smoke: PASS'
